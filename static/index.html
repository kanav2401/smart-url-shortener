<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart URL Shortener</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Smart URL Shortener</h1>

    <p class="subtitle">
        Shorten URLs and track their performance.
    </p>

    <div class="card">

        <label for="url">Long URL</label>

        <input
            id="url"
            type="url"
            placeholder="https://example.com/very-long-url"
        >

        <label for="custom">Custom Code (Optional)</label>

        <input
            id="custom"
            type="text"
            placeholder="my-link"
        >
            <label for="expiration">Expiration</label>

<select id="expiration">
    <option value="">Never</option>
    <option value="1">1 Day</option>
    <option value="7">7 Days</option>
    <option value="30">30 Days</option>
</select>
        <button onclick="shortenURL()">
            Shorten URL
        </button>

        <div id="result"></div>

    </div>

    <div id="analytics" class="card analytics-card">

        <h2>URL Analytics</h2>

        <div id="analyticsContent">
            <p>Create a shortened URL to view its analytics.</p>
        </div>

    </div>

    <div class="card urls-card">

        <div class="section-header">
            <div>
                <h2>My URLs</h2>
                <p class="section-description">
                    Manage your shortened URLs.
                </p>
            </div>

            <button
                class="refresh-button"
                onclick="loadURLs()"
            >
                Refresh
            </button>
        </div>

        <div id="urlsContent">
            <p>Loading URLs...</p>
        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
