<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart URL Shortener</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

<div class="container">

    <h1>Smart URL Shortener</h1>

    <p class="subtitle">
        Shorten URLs and track their performance.
    </p>


    <div class="card">

        <label for="url">
            Long URL
        </label>

        <input
            id="url"
            type="url"
            placeholder="https://example.com/very-long-url"
        >


        <label for="custom">
            Custom Code (Optional)
        </label>

        <input
            id="custom"
            type="text"
            placeholder="my-link"
        >


        <label for="expiration">
            Expiration Date (Optional)
        </label>

        <input
            id="expiration"
            type="datetime-local"
        >


        <button onclick="shortenURL()">
            Shorten URL
        </button>


        <div id="result"></div>

    </div>


    <div class="dashboard">

        <div class="section-header">

            <div>
                <h2>Your URLs</h2>

                <p class="section-description">
                    Manage your shortened URLs and view their analytics.
                </p>
            </div>

        </div>


        <input
            id="search"
            type="text"
            placeholder="Search by URL or short code..."
            oninput="searchURLs()"
        >


        <div id="url-list"></div>


        <div id="pagination"></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<script src="/static/app.js"></script>

</body>

</html>
