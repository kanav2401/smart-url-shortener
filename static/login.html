<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart URL Shortener</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Smart URL Shortener</h1>

        <p class="auth-subtitle">
            Login to manage your shortened URLs.
        </p>


        <form id="login-form">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div
            id="login-message"
            class="auth-message"
        ></div>


        <p class="auth-switch">
            Don't have an account?

            <a href="/register">
                Create an account
            </a>
        </p>

    </div>

</div>


<script src="/static/login.js"></script>

</body>

</html>
